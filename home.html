<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNACDEMY</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020617;color:#fff;font-family:sans-serif}

/* SPLASH */
#splash{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#020617;z-index:9999;
}
.logo{
  font-size:38px;
  color:#22c55e;
  text-shadow:0 0 20px #22c55e;
}
.loader{
  margin-top:20px;
  width:60px;height:60px;
  border-radius:50%;
  border:4px solid transparent;
  border-top:4px solid #22c55e;
  border-right:4px solid #3b82f6;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:12px;
  border-bottom:1px solid #1e293b;
}
.live{
  background:#22c55e;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}

/* MAIN */
.container{padding:15px}

/* CARD */
.card{
  background:#020617;
  border:1px solid #1e293b;
  border-radius:15px;
  padding:20px;
  margin-bottom:15px;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}
.offline{background:#22c55e}
.online{background:#2563eb}
.selection{background:#f59e0b}
.testbook{background:#8b5cf6}

/* IFRAME */
#iframeBox{
  position:fixed;inset:0;
  background:#000;
  display:none;
  z-index:99999;
}
#iframeBox iframe{
  width:100%;height:100%;border:none;
}

/* LOADER */
#frameLoader{
  position:fixed;inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:#020617;
  z-index:99999;
}
.loader2{
  width:70px;height:70px;
  border-radius:50%;
  border:5px solid transparent;
  border-top:5px solid #22c55e;
  border-right:5px solid #3b82f6;
  animation:spin 1s linear infinite;
}

/* BACK ANIMATION */
.fade-out{
  animation:fadeOut .4s ease forwards;
}
@keyframes fadeOut{
  to{
    opacity:0;
    transform:scale(.95);
  }
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <div class="logo">FREE Education</div>
  <div class="loader"></div>
</div>

<!-- LOADER -->
<div id="frameLoader">
  <div class="loader2"></div>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

  <div class="topbar">
    <div>☰ FREE FOR ALL🇮🇳</div>
    <div class="live">LIVE</div>
  </div>

  <div class="container">

    <div class="card">
      <h2>📂  UNACADEMY Offline</h2>
      <button class="offline" onclick="openOffline()">OPEN</button>
    </div>

    <div class="card">
      <h2>🎯 UNACDEMY Online</h2>
      <button class="online" onclick="openOnline()">OPEN</button>
    </div>

    <div class="card">
      <h2>🚀 Selection Way</h2>
      <button class="selection" onclick="openSelection()">OPEN</button>
    </div>

    <div class="card">
      <h2>📘 Testbook</h2>
      <button class="testbook" onclick="openTestbook()">OPEN</button>
    </div>

  </div>
</div>

<!-- IFRAME -->
<div id="iframeBox">
  <iframe id="frame"></iframe>
</div>

<script>

/* SPLASH */
setTimeout(()=>{
  splash.style.display="none";
  main.style.display="block";
},2000);

/* OPEN FRAME */
function openFrame(url){
  frameLoader.style.display="flex";

  setTimeout(()=>{
    frame.src=url;
    iframeBox.style.display="block";
    frameLoader.style.display="none";

    // history push for back control
    history.pushState({iframe:true}, "", "");
  },800);
}

/* PREVIEW SYSTEM */
function startPreview(encoded){
  let url=atob(encoded);

  sessionStorage.setItem("target",encoded);

  openFrame(url);

  setTimeout(()=>{
    iframeBox.style.display="none";
    openFrame("verify.html");
  },60000);
}

/* BUTTONS */
function openOffline(){
  startPreview("aHR0cHM6Ly9zdHVkeXVrLnNpdGUvb2ZmbGluZQ==");
}
function openOnline(){
  startPreview("aHR0cHM6Ly9zdHVkeXVrLnNpdGUvb25saW5l");
}
function openSelection(){
  startPreview("aHR0cHM6Ly9zdy5yb2xleGNvZGVyei5saXZl");
}
function openTestbook(){
  startPreview("aHR0cHM6Ly90ZXN0Ym9vay5wd3Rob3Iuc2l0ZQ==");
}

/* BACK PRESS CONTROL */
history.pushState(null, "", "");

window.addEventListener("popstate", function(e){

  if(iframeBox.style.display === "block"){
    iframeBox.classList.add("fade-out");

    setTimeout(()=>{
      iframeBox.style.display="none";
      iframeBox.classList.remove("fade-out");

      history.pushState(null, "", "");
    },400);

  } else {
    history.pushState(null, "", "");
  }

});

</script>

</body>
</html>
